name: Build SIMBA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q commandlinetools-linux-15859902_latest.zip -d cmdline-tools
          rm commandlinetools-linux-15859902_latest.zip
          rm -rf cmdline-tools/latest
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Install Gradle 9.5.1
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          unzip -q gradle-9.5.1-bin.zip
          rm gradle-9.5.1-bin.zip
          echo "$PWD/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test "$ANDROID_HOME" = "$ANDROID_SDK_ROOT"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMBA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
